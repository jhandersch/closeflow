name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tenancy guard
        run: npm run lint:tenancy
      - name: Unit and security tests
        run: |
          npm run test:ai-cost
          npm run test:ai-routes
          npm run test:maintenance
          npm run test:input-limits
          npm run test:alerting
          npm run test:csrf
          npm run test:integrations
          npm run test:csv
          npm run test:usage-quota
          npm run test:workspace-auth
          npm run test:mfa-recovery
          npm run test:auth-session-security
          npm run test:security-error-contract
          npm run test:session-timeout
          npm run test:invite-email-confirmation
          npm run test:rate-limit-fail-closed
          npm run test:critical-rate-limit-coverage
          npm run test:request-schema-contract
          npm run test:field-validation-contract
          npm run test:write-route-validation-contract
          npm run test:remaining-write-validation-contract
          npm run test:write-abuse-limit-contract
          npm run test:privileged-workspace-abuse-contract
          npm run test:audit-log-access-contract
          npm run test:cron-auth-contract
          npm run test:export-error-contract
          npm run test:backup-restore-safety-contract
          npm run test:api-auth-surface-contract
          npm run test:monitoring-error-contract
          npm run test:integration-abuse-contract
          npm run test:remaining-mutation-abuse-contract
          npm run test:activity-abuse-contract
          npm run test:billing-integration-security-contract
          npm run test:profile-onboarding-invite-abuse-contract
          npm run test:ai-output-validation-contract
          npm run test:lead-analysis-security-contract
          npm run test:notifications-usage-security-contract
          npm run test:data-read-abuse-contract
          npm run test:export-file-security-contract
          npm run test:calendar-workspace-security-contract
          npm run test:general-api-read-security-contract
          npm run test:remaining-ai-input-security-contract
          npm run test:health-cron-security-contract
          npm run test:ai-chat-followup-input-contract
          npm run test:supabase-storage-realtime-contract
          npm run test:supabase-function-grant-contract
          npm run test:github-actions-pinning-contract
          npm run test:feedback-token
          npm run test:workflow-automations
          npm run test:workspace-capacity
      - name: Dependency vulnerabilities (production, high and above)
        run: npm audit --omit=dev --audit-level=high
      - name: License check
        run: node scripts/check-licenses.mjs
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit=dev > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90
